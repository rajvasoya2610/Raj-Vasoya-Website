name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          elif [ -f yarn.lock ]; then
            corepack enable && yarn install --frozen-lockfile || yarn install
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable && pnpm install --frozen-lockfile || pnpm install
          else
            npm install --legacy-peer-deps
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Application
        run: |
          BASE_PATH="${{ steps.pages.outputs.base_path }}"
          if [ -z "$BASE_PATH" ] || [ "$BASE_PATH" = "/" ]; then
            FINAL_BASE="/"
          else
            FINAL_BASE="${BASE_PATH%/}/"
          fi
          echo "Building with base: $FINAL_BASE"
          npm run build -- --base="$FINAL_BASE"
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          cp -r dist/assets/* dist/ 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
